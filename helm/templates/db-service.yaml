{{- if eq .Values.postgres.mode "standalone" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "garden.fullname" . }}-db
  labels:
    {{- include "garden.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: pg
  selector:
    component: db
{{- end }}
